services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PIXELVAULT_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
